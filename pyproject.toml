[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "material-qt"
version = "0.1.0"
description = "Qt6/PySide6 port of Google's Material Design 3 (Material Web Components)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff", "black", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/material_qt"]

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
